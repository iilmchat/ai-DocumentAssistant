apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "alembic upgrade head && python scripts/smoke_check.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecrets.secretName | default "ai-document-assistant-secrets" }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-document-assistant-secrets
                  key: DATABASE_URL
            - name: STORAGE_BACKEND
              value: {{ .Values.storage.backend | quote }}
            - name: S3_BUCKET
              value: {{ .Values.storage.s3Bucket | quote }}
            - name: RATE_LIMIT_REDIS
              value: "true"
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources.backend | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - port: {{ .Values.service.backendPort }}
      targetPort: 8000
