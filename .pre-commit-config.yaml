repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: mypy --config-file=backend/mypy.ini
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: true

  # Требует установленный бинарник gitleaks (в CI ставится через gitleaks-action).
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets scan)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
