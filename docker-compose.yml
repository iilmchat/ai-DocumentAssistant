# Параметры БД/секретов задаются в корневом .env (не коммитится).
# Примеры — в backend/.env.example.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_documents}
    ports:
      # Только локальный хост — не открываем БД наружу
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_documents}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S4: ежедневный pg_dump с ротацией копий (02:00 UTC, хранить 30 дней)
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: ai_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-ai_documents}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SCHEDULE: "0 2 * * *"
      BACKUP_KEEP_DAYS: 30
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy

  # S3: опциональный пул соединений. Включение: DB_HOST=pgbouncer DB_PORT=6432
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ai_pgbouncer
    restart: unless-stopped
    volumes:
      - ./ops/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./ops/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ai_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-ai_documents}"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_change_me_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - shared_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_celery_worker
    restart: unless-stopped
    # S2: тот же воркер разбирает и DLQ-очередь
    command: celery -A app.worker.celery_app worker --loglevel=info -Q default,dlq --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-ai_documents}"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_change_me_in_production}
      UPLOAD_DIR: /app/storage
    volumes:
      - shared_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # T9: S3-совместимое хранилище (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-14-51Z
    container_name: ai_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # T6: отдельная очередь перевода (самая дорогая операция — лимит стоимости в .env)
  translation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_translation_worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info -Q translation --concurrency=1
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-ai_documents}"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_change_me_in_production}
      UPLOAD_DIR: /app/storage
    volumes:
      - shared_storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ocr-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: ai_ocr_worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info -Q ocr --concurrency=1
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-ai_documents}"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_change_me_in_production}
      UPLOAD_DIR: /app/storage
      OCR_ENGINE: tesseract
    volumes:
      - shared_storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: ai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

  # S4: планировщик периодических задач (retention)
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_celery_beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-ai_documents}"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # S2: мониторинг задач Celery
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_flower
    restart: unless-stopped
    command: celery -A app.worker.celery_app flower --port=5555 --address=0.0.0.0
    env_file:
      - ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai_prometheus
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  shared_storage:
  prometheus_data:
  grafana_data:
  backup_data:
  minio_data:
