line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# FastAPI использует Depends(...) в значениях по умолчанию — это норма
"app/api/*.py" = ["B008"]

[format]
quote-style = "double"
indent-style = "space"
