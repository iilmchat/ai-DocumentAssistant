[mypy]
python_version = 3.11
ignore_missing_imports = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
show_error_codes = True
namespace_packages = True
plugins = sqlalchemy.ext.mypy.plugin
exclude = (alembic/versions/)

# Постепенное ужесточение: сначала ловим явные ошибки, не требуя аннотаций везде
check_untyped_defs = True
disallow_untyped_defs = False

# Модели написаны в стиле Column[...] (без Mapped-аннотаций), поэтому mypy
# не раскрывает типы атрибутов ORM. Временно глушим только эти коды — до
# перехода на Mapped[...] в отдельном спринте.
[mypy-app.worker]
disable_error_code = assignment, arg-type

[mypy-app.api.documents]
disable_error_code = assignment, arg-type, call-overload, attr-defined

[mypy-app.api.auth]
disable_error_code = arg-type

[mypy-app.api.chat]
disable_error_code = attr-defined

[mypy-app.services.document_translation]
disable_error_code = assignment, arg-type, attr-defined, misc

[mypy-app.api.organizations]
disable_error_code = assignment, arg-type
